services:
  spotui:
    build:
      context: .
    container_name: spotui
    ports:
      - "8080:8080"
    environment:
      SPOTUI_HOST: 0.0.0.0
      SPOTUI_PORT: 8080
      SPOTUI_OUTPUT_DIR: /music
      SPOTUI_CONFIG_DIR: /config
      SPOTUI_COOKIE_FILE: /config/cookies.txt
      SPOTUI_OUTPUT_TEMPLATE: "{artist}/{album}/{track-number} - {title}.{output-ext}"
      SPOTUI_DEFAULT_FORMAT: mp3
      SPOTUI_DEFAULT_BITRATE: 128k
    volumes:
      - ./data/music:/music
      - ./data/config:/config
    restart: unless-stopped

